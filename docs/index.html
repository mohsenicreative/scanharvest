<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megascans Claimer</title>
<meta name="description" content="A free, open-source browser extension that adds every free Quixel Megascans listing on Fab to your library, one at a time.">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="images/icon-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a; --surface: #0c0f18; --surface-2: #121625; --line: rgba(148,163,255,.10); --line-strong: rgba(148,163,255,.2);
    --text: #eef0fa; --muted: #8e95ad; --accent: #3d6bff; --accent-hi: #5b82ff; --periwinkle: #8b9cff; --warn: #fbbf24;
    --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  html[lang="fa"] { --font: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif; }
  html[lang="zh"] { --font: "Inter", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  .icon { display: block; flex: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* background */
  .bg { position: absolute; inset: 0 0 auto; height: 1100px; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg::before { content: ""; position: absolute; left: 50%; top: -340px; width: 1200px; height: 900px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(61,107,255,.45), rgba(61,107,255,.08) 60%, transparent); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(148,163,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,255,.05) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(70% 60% at 50% 20%, #000 30%, transparent 75%); }
  main, header.nav { position: relative; z-index: 1; }

  /* nav */
  header.nav { position: sticky; top: 14px; z-index: 20; margin-top: 14px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 16px;
    background: rgba(12, 15, 24, .72); border: 1px solid var(--line-strong); backdrop-filter: blur(14px); }
  html[dir="rtl"] .bar { padding: 8px 14px 8px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .links { display: flex; gap: 4px; margin-inline-start: auto; }
  .links a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 9px; }
  .links a:hover { color: var(--text); background: rgba(148,163,255,.08); }
  .lang { position: relative; }
  .lang-btn { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 10px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .lang-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .flag-box { width: 22px; height: 15px; border-radius: 3px; overflow: hidden; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.14); flex: none; }
  .flag { width: 100%; height: 100%; display: block; }
  .menu { position: absolute; inset-inline-end: 0; top: calc(100% + 8px); width: 190px; padding: 6px; border-radius: 12px;
    background: #0f1220; border: 1px solid var(--line-strong); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  .menu[hidden] { display: none; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0;
    background: none; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; text-align: start; }
  .menu button:hover, .menu button[aria-selected="true"] { background: rgba(61,107,255,.15); }
  .menu .check { margin-inline-start: auto; color: var(--accent-hi); }
  .gh { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .gh:hover { color: var(--text); border-color: var(--line-strong); }

  /* hero */
  .hero { text-align: center; padding: 88px 0 40px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    background: rgba(61,107,255,.10); border: 1px solid rgba(91,130,255,.35); color: #c8d3ff; }
  html[dir="rtl"] .badge { padding: 5px 5px 5px 12px; }
  .badge b { background: var(--accent); color: #fff; padding: 1px 10px; border-radius: 999px; font-size: 12px; }
  h1 { font-size: clamp(36px, 6.4vw, 68px); line-height: 1.06; letter-spacing: -2px; margin: 22px auto 0; max-width: 900px; font-weight: 800; }
  html[lang="fa"] h1, html[lang="zh"] h1 { letter-spacing: 0; line-height: 1.25; }
  h1 .grad { background: linear-gradient(90deg, #5b82ff, #8b9cff 55%, #c0c9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { max-width: 680px; margin: 22px auto 0; color: var(--muted); font-size: 17.5px; }
  .lead b { color: var(--text); font-weight: 600; }
  .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 9px; padding: 13px 22px; border-radius: 13px; font-weight: 600; font-size: 15px; text-decoration: none;
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); transition: transform .1s, background .15s; }
  .btn:hover { background: #1a1f33; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--accent), #6a7dff);
    box-shadow: 0 10px 30px rgba(61,107,255,.4), inset 0 1px 0 rgba(255,255,255,.22); }
  .btn.primary:hover { background: linear-gradient(135deg, var(--accent-hi), #7b8cff); }
  .meta { margin-top: 16px; font-size: 13.5px; color: var(--muted); }

  /* showcase */
  .showcase { position: relative; margin: 56px auto 0; max-width: 1000px; }
  .window { border-radius: 18px; overflow: hidden; border: 1px solid var(--line-strong); background: #0a0c14;
    box-shadow: 0 40px 120px rgba(20, 40, 140, .35), 0 0 0 1px rgba(255,255,255,.03); }
  .window .chrome { display: flex; gap: 6px; padding: 11px 14px; border-bottom: 1px solid var(--line); background: #0c0f18; }
  .window .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #2a2f42; }
  .window img { display: block; width: 100%; height: auto; }
  .popup-shot { position: absolute; inset-inline-end: -28px; bottom: -48px; width: 250px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line-strong); box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(91,130,255,.15); }
  .popup-shot img { display: block; width: 100%; }
  figcaption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* sections */
  section { padding: 96px 0 0; }
  .sec-head { text-align: center; max-width: 660px; margin: 0 auto 36px; }
  h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -1px; margin: 0; line-height: 1.15; }
  html[lang="fa"] h2, html[lang="zh"] h2 { letter-spacing: 0; }
  .sec-head p { color: var(--muted); margin: 12px 0 0; }
  .features { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .card { padding: 22px; border-radius: 18px; border: 1px solid var(--line);
    background: radial-gradient(120% 90% at 0% 0%, rgba(61,107,255,.10), transparent 55%), linear-gradient(180deg, var(--surface-2), var(--surface)); }
  html[dir="rtl"] .card { background: radial-gradient(120% 90% at 100% 0%, rgba(61,107,255,.10), transparent 55%), linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .card .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--periwinkle);
    background: rgba(61,107,255,.14); border: 1px solid rgba(91,130,255,.25); margin-bottom: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; }

  .steps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
  .steps li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), #6a7dff); }
  .steps b.t { display: block; font-size: 15.5px; margin-bottom: 2px; }
  .steps p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .steps b:not(.t) { color: var(--text); font-weight: 600; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .88em; padding: 1px 6px; border-radius: 6px;
    background: rgba(148,163,255,.10); color: #c8d3ff; direction: ltr; unicode-bidi: isolate; }
  .col-title { display: flex; align-items: center; gap: 10px; font-size: 20px; margin: 0 0 14px; }
  .col-title .icon { color: var(--periwinkle); }
  .col-sub { color: var(--muted); margin: -8px 0 14px; font-size: 14.5px; }

  .note { display: flex; gap: 14px; margin-top: 22px; padding: 18px 20px; border-radius: 16px;
    background: rgba(251,191,36,.06); border: 1px solid rgba(251,191,36,.22); color: #f3d98b; }
  .note .icon { color: var(--warn); margin-top: 3px; }
  .note b { display: block; color: #fde68a; margin-bottom: 2px; }
  .note p { margin: 0; font-size: 14.5px; }

  .faq { max-width: 820px; margin: 0 auto; display: grid; gap: 10px; }
  details { border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  summary { display: flex; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; list-style: none; font-weight: 600; }
  summary::-webkit-details-marker { display: none; }
  summary .chev { margin-inline-start: auto; color: var(--muted); transition: transform .2s; }
  details[open] summary .chev { transform: rotate(180deg); }
  details p { margin: 0; padding: 0 18px 16px; color: var(--muted); font-size: 15px; }

  footer { margin-top: 96px; padding: 28px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  footer a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }

  @media (max-width: 940px) {
    .features { grid-template-columns: 1fr 1fr; }
    .steps-grid { grid-template-columns: 1fr; }
    .popup-shot { width: 190px; inset-inline-end: -8px; bottom: -36px; }
  }
  @media (max-width: 640px) {
    .links { display: none; }
    .lang { margin-inline-start: auto; }
    .hero { padding-top: 60px; }
    h1 { letter-spacing: -1px; }
    .features { grid-template-columns: 1fr; }
    .popup-shot { display: none; }
    .brand span { display: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="nav">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#"><img src="images/icon-128.png" alt=""><span>Megascans Claimer</span></a>
      <nav class="links">
        <a href="#how" data-t="nav_how"></a>
        <a href="#install" data-t="nav_install"></a>
        <a href="#faq" data-t="nav_faq"></a>
      </nav>
      <div class="lang">
        <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false"><span class="flag-box" id="langFlag"></span><span data-icon="chevronDown"></span></button>
        <div class="menu" id="langMenu" role="listbox" hidden></div>
      </div>
      <a class="gh" href="https://github.com/mohsenicreative/megascans-claimer" aria-label="GitHub"><span data-icon="github"></span></a>
    </div>
  </div>
</header>

<main>
  <div class="wrap hero">
    <span class="badge"><b>New</b><span data-t="badge"></span><span data-icon="arrowRight" data-size="14" class="flip"></span></span>
    <h1><span data-t="h1a"></span><br><span class="grad" data-t="h1b"></span></h1>
    <p class="lead" data-html="lead"></p>
    <div class="ctas">
      <a class="btn primary" href="https://github.com/mohsenicreative/megascans-claimer/releases/latest/download/MegascansClaimer.zip"><span data-icon="download"></span><span data-t="cta_download"></span></a>
      <a class="btn" href="https://github.com/mohsenicreative/megascans-claimer"><span data-icon="github"></span><span data-t="cta_github"></span></a>
    </div>
    <p class="meta" data-t="meta"></p>

    <figure class="showcase">
      <div class="window"><div class="chrome"><i></i><i></i><i></i></div><img src="images/panel-en.png" alt="" data-alt="shot_panel" width="1440" height="860"></div>
      <div class="popup-shot"><img id="popupShot" src="images/popup-en.png" alt="" data-alt="shot_popup"></div>
      <figcaption data-t="shot_panel"></figcaption>
    </figure>
  </div>

  <section id="how">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="how_title"></h2><p data-t="how_sub"></p></div>
      <div class="features">
        <div class="card"><div class="ico" data-icon="shield" data-size="20"></div><h3 data-t="f1t"></h3><p data-t="f1d"></p></div>
        <div class="card"><div class="ico" data-icon="gauge" data-size="20"></div><h3 data-t="f2t"></h3><p data-t="f2d"></p></div>
        <div class="card"><div class="ico" data-icon="pause" data-size="20"></div><h3 data-t="f3t"></h3><p data-t="f3d"></p></div>
        <div class="card"><div class="ico" data-icon="globe" data-size="20"></div><h3 data-t="f4t"></h3><p data-t="f4d"></p></div>
      </div>
    </div>
  </section>

  <section id="install">
    <div class="wrap">
      <div class="steps-grid">
        <div>
          <h2 class="col-title"><span data-icon="layers" data-size="22"></span><span data-t="install_title"></span></h2>
          <p class="col-sub" data-t="install_sub"></p>
          <ol class="steps">
            <li><div><b class="t" data-t="i1t"></b><p data-html="i1d"></p></div></li>
            <li><div><b class="t" data-t="i2t"></b><p data-html="i2d"></p></div></li>
            <li><div><b class="t" data-t="i3t"></b><p data-html="i3d"></p></div></li>
            <li><div><b class="t" data-t="i4t"></b><p data-html="i4d"></p></div></li>
            <li><div><b class="t" data-t="i5t"></b><p data-html="i5d"></p></div></li>
          </ol>
        </div>
        <div id="use">
          <h2 class="col-title"><span data-icon="sparkles" data-size="22"></span><span data-t="use_title"></span></h2>
          <p class="col-sub">&nbsp;</p>
          <ol class="steps">
            <li><div><b class="t" data-t="u1t"></b><p data-html="u1d"></p></div></li>
            <li><div><b class="t" data-t="u2t"></b><p data-html="u2d"></p></div></li>
            <li><div><b class="t" data-t="u3t"></b><p data-html="u3d"></p></div></li>
            <li><div><b class="t" data-t="u4t"></b><p data-html="u4d"></p></div></li>
            <li><div><b class="t" data-t="u5t"></b><p data-html="u5d"></p></div></li>
          </ol>
        </div>
      </div>
      <div class="note"><span data-icon="alert" data-size="20"></span><p><b data-t="note_title"></b><span data-t="note"></span></p></div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="faq_title"></h2></div>
      <div class="faq" id="faqList"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-t="footer"></span>
    <span style="display:flex;gap:20px;flex-wrap:wrap">
      <a href="privacy.html"><span data-icon="shield" data-size="16"></span>Privacy</a>
      <a href="https://github.com/mohsenicreative/megascans-claimer"><span data-icon="github" data-size="16"></span>mohsenicreative/megascans-claimer</a>
    </span>
  </div>
</footer>

<script src="assets/icons.js"></script>
<script src="assets/flags.js"></script>
<script src="i18n-guide.js"></script>
<script>
(() => {
  const S = window.GUIDE_STRINGS;
  const LANGS = [
    { code: 'en', name: 'English', dir: 'ltr' }, { code: 'fa', name: 'فارسی', dir: 'rtl' },
    { code: 'fr', name: 'Français', dir: 'ltr' }, { code: 'de', name: 'Deutsch', dir: 'ltr' },
    { code: 'es', name: 'Español', dir: 'ltr' }, { code: 'zh', name: '中文', dir: 'ltr' }
  ];
  const store = {
    get() { try { return localStorage.getItem('msc-lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('msc-lang', v); } catch {} }
  };
  const initial = () => {
    const q = new URLSearchParams(location.search).get('lang');
    const pick = [q, store.get(), (navigator.language || 'en').slice(0, 2).toLowerCase()].find(c => c && S[c]);
    return pick || 'en';
  };
  let lang = initial();
  const t = k => S[lang][k] ?? S.en[k] ?? '';

  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = ICONS.svg(el.dataset.icon, Number(el.dataset.size) || 18);
  });

  // GitHub mark is not part of Lucide's set in icons.js; add it here (Lucide "github" icon, ISC).
  const gh = '<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>';
  document.querySelectorAll('[data-icon="github"]').forEach(el => { el.innerHTML = gh; });

  function faq() {
    const list = document.getElementById('faqList');
    list.replaceChildren();
    for (let i = 1; i <= 6; i++) {
      const d = document.createElement('details');
      d.innerHTML = `<summary><span></span><span class="chev">${ICONS.svg('chevronDown', 18)}</span></summary><p></p>`;
      d.querySelector('summary span').textContent = t(`q${i}`);
      d.querySelector('p').textContent = t(`a${i}`);
      list.append(d);
    }
  }

  function menu() {
    const box = document.getElementById('langMenu');
    box.replaceChildren();
    for (const l of LANGS) {
      const b = document.createElement('button');
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', String(l.code === lang));
      b.innerHTML = `<span class="flag-box">${FLAGS[l.code]}</span><span></span>${l.code === lang ? `<span class="check">${ICONS.svg('check', 15)}</span>` : ''}`;
      b.children[1].textContent = l.name;
      b.children[1].lang = l.code;
      b.children[1].dir = l.dir;
      b.addEventListener('click', () => { apply(l.code); toggle(false); });
      box.append(b);
    }
  }

  function toggle(open) {
    const box = document.getElementById('langMenu');
    const show = open ?? box.hidden;
    box.hidden = !show;
    document.getElementById('langBtn').setAttribute('aria-expanded', String(show));
  }

  function apply(code) {
    lang = S[code] ? code : 'en';
    store.set(lang);
    const info = LANGS.find(l => l.code === lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = info.dir;
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-html]').forEach(el => { el.innerHTML = t(el.dataset.html); }); // bundled, trusted strings
    document.querySelectorAll('[data-alt]').forEach(el => { el.alt = t(el.dataset.alt); });
    document.querySelectorAll('.flip').forEach(el => { el.style.transform = info.dir === 'rtl' ? 'scaleX(-1)' : ''; });
    document.getElementById('langFlag').innerHTML = FLAGS[lang];
    document.getElementById('langBtn').title = t('language');
    document.getElementById('popupShot').src = lang === 'fa' ? 'images/popup-fa.png' : 'images/popup-en.png';
    menu();
    faq();
  }

  document.getElementById('langBtn').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  document.addEventListener('click', e => { if (!e.target.closest('.lang')) toggle(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
  apply(lang);
})();
</script>
</body>
</html>
