name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Consistency checks
        run: node tools/check.mjs

      - name: Build zip
        run: |
          mkdir -p build/ScanHarvest
          cp -r extension/. build/ScanHarvest/
          cp LICENSE THIRD_PARTY_NOTICES.md build/ScanHarvest/
          (cd build && zip -r -X ../ScanHarvest.zip ScanHarvest)
          (cd build/ScanHarvest && zip -r -X ../../ScanHarvest-webstore.zip .)
          cp -r build/ScanHarvest build/ScanHarvest-firefox
          node tools/firefox-manifest.mjs build/ScanHarvest-firefox
          (cd build/ScanHarvest-firefox && zip -r -X ../../ScanHarvest-firefox.zip .)
          sha256sum ScanHarvest.zip ScanHarvest-webstore.zip ScanHarvest-firefox.zip > SHA256SUMS.txt

      - name: Validate Firefox package
        run: npx --yes web-ext@10 lint --source-dir build/ScanHarvest-firefox --self-hosted=false

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download **ScanHarvest.zip**, extract it, open \`chrome://extensions\` or \`edge://extensions\`, turn on Developer mode and choose **Load unpacked**."
            echo "**ScanHarvest-webstore.zip** is the same build packaged for the Chrome Web Store and Edge Add-ons."
            echo "**ScanHarvest-firefox.zip** is the Firefox build for addons.mozilla.org (Firefox only installs signed add-ons)."
            echo "Step-by-step guide in 6 languages: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ScanHarvest.zip ScanHarvest-webstore.zip ScanHarvest-firefox.zip SHA256SUMS.txt \
            --title "ScanHarvest $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
