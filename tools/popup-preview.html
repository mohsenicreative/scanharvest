<!doctype html>
<!--
  Popup preview for development and screenshots. Serve the repo root over HTTP, then open:
    /tools/popup-preview.html?state=running|finished|none&lang=en|fa|fr|de|es|zh
  Chrome APIs are replaced by tools/preview-stub.js with sample data.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup preview</title>
  <style>html { background: #06070c; overflow: hidden; } body { margin: 0 auto !important; }</style>
</head>
<body>
<script src="preview-stub.js"></script>
<script>
(async () => {
  const v = Date.now();
  const source = await (await fetch(`../extension/popup.html?v=${v}`)).text();
  const doc = new DOMParser().parseFromString(source, 'text/html');
  doc.querySelectorAll('script').forEach(s => s.remove());
  doc.querySelectorAll('img').forEach(img => { img.src = `../extension/${img.getAttribute('src')}`; });
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = `../extension/popup.css?v=${v}`;
  document.head.append(css);
  document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);
  for (const name of ['i18n', 'icons', 'flags', 'popup']) {
    await new Promise(resolve => {
      const s = document.createElement('script');
      s.src = `../extension/${name}.js?v=${v}`;
      s.onload = resolve;
      document.body.append(s);
    });
  }
  if (new URLSearchParams(location.search).has('menu')) setTimeout(() => document.getElementById('langBtn').click(), 300);
})();
</script>
</body>
</html>
